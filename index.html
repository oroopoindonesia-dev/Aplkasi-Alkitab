<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alkitab PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 sticky top-0 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">Alkitab Digital</h1>
        <button id="installBtn" class="hidden bg-amber-500 hover:bg-amber-600 text-white px-3 py-1 rounded text-sm font-semibold">
            Install Aplikasi
        </button>
    </header>

    <!-- Pilihan Kitab & Pasal -->
    <main class="max-w-3xl mx-auto p-4">
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-sm font-medium mb-1">Kitab:</label>
                <select id="selectKitab" class="w-full p-2 bg-white border rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Pasal:</label>
                <select id="selectPasal" class="w-full p-2 bg-white border rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></select>
            </div>
        </div>

        <!-- Konten Ayat -->
        <div id="loading" class="text-center text-gray-500 my-8 hidden">Memuat ayat...</div>
        <div id="kontenAlkitab" class="bg-white p-6 rounded-lg shadow-md space-y-4"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
