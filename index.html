<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alkitab Digital</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- KODE PWA BARU DI SINI -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
    <header>
        <h1>Alkitab Digital</h1>
        <div class="search-container">
            <select id="kitab-select">
                <!-- Pilihan kitab akan diisi oleh JavaScript -->
            </select>
            <input type="number" id="pasal-input" min="1" value="1" placeholder="Pasal">
            <button id="cari-btn">Buka</button>
        </div>
    </header>

    <main>
        <h2 id="judul-pasal">Pilih Kitab dan Pasal</h2>
        <div id="konten-alkitab">
            <!-- Teks ayat akan muncul di sini -->
            <p class="placeholder">Silakan pilih kitab dan pasal, lalu klik Buka.</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Alkitab Digital | Powered by GitHub Pages & API Alkitab</p>
    </footer>

    <script src="script.js"></script>

    <!-- SCRIPT PWA BARU DI SINI -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA Aktif!'))
                    .catch(err => console.log('Gagal pasang PWA', err));
            });
        }
    </script>
</body>
</html>
